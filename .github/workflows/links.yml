name: Проверка ссылок

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [main]

jobs:
  lychee:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Проверка ссылок в markdown
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --timeout 30
            --max-retries 2
            --accept 200,202,206,401,403,405,429,503
            --accept-timeouts
            --insecure
            --exclude 't\.me/|telegram\.me/|telegram\.im/|play\.google\.com|youtube\.com|twitter\.com|x\.com'
            '**/*.md'
          output: lychee-report.md
          fail: false

      - name: Отчёт в артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: lychee-report.md

      - name: Создать issue о битых ссылках
        if: steps.lychee.outputs.exit_code == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'Автоматическая проверка ссылок обнаружила проблемы.\n\n';
            try {
              body += fs.readFileSync('lychee-report.md', 'utf8');
            } catch (e) {
              body += 'Отчёт см. в артефакте workflow.';
            }
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'broken-links'
            });
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Обнаружены битые ссылки',
                body,
                labels: ['broken-links']
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body
              });
            }
